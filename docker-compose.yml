# =============================================================================
# IRIS — Development Docker Compose (10 Services)
#
# Architecture: Django API + FastAPI AI Gateway + Docling-serve + 3 Celery
# queues + Celery Beat + PostgreSQL/pgvector + Redis + Vite Frontend
#
# See: docs/docker_compose_rag_services.md for full architecture rationale
# See: docs/rag_pipeline_service_map.md for phase-to-service mapping
# =============================================================================

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      # Sourced from the repo-root .env (see .env.example). ":?" makes an
      # unset value stop `docker compose up` with a named error instead of
      # provisioning Postgres with a credential committed to the repository.
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in the repo-root .env}
      POSTGRES_USER: ${DB_USER:?set DB_USER in the repo-root .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the repo-root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENT_FILE: development.txt
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - media_files:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DB_HOST=db
      - DB_NAME=${DB_NAME:?set DB_NAME in the repo-root .env}
      - DB_USER=${DB_USER:?set DB_USER in the repo-root .env}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in the repo-root .env}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DOCLING_API_URL=http://docling:5001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_AI_API_BASE_URL=http://localhost:8001/api/v1
      # Bind-mounted source on Windows/macOS emits no inotify events — poll instead
      # so edits on the host hot-reload. See frontend/vite.config.ts.
      - VITE_USE_POLLING=1

  # AI services
  docling:
    image: quay.io/docling-project/docling-serve:latest
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - DOCLING_SERVE_ENABLE_UI=1
      - DOCLING_SERVE_CONCURRENCY=4
      - DOCLING_SERVE_MAX_NUM_PAGES=200
      - DOCLING_SERVE_MAX_FILE_SIZE=52428800 # 50MB
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:5001/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4g

  ai-gateway:
    build:
      context: ./ai
      dockerfile: Dockerfile
    restart: unless-stopped
    # No published port (ADR-014 precondition 2, IR-156). The gateway
    # holds a provider API key and is reached only over the Compose
    # network by backend and celery. It used to publish 8001:8001,
    # which put it on the host for anything that could reach it.
    env_file:
      - ./ai/.env
    environment:
      # Same repo-root .env as every other service, so the credential is
      # configured in exactly one place. Note ADR-014 precondition 4 says
      # the gateway gets no direct DB access at all -- that this DSN
      # exists is a contradiction recorded on IR-154, to be resolved by
      # IR-58, not silently here.
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:?set DB_USER in the repo-root .env}:${DB_PASSWORD:?set DB_PASSWORD in the repo-root .env}@db:5432/${DB_NAME:?set DB_NAME in the repo-root .env}
      - UVICORN_WORKERS=4
      - MAX_CONCURRENT_LLM=80
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  # Celery workers
  celery-default:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENT_FILE: development.txt
    restart: unless-stopped
    command: celery -A config worker -l info -Q default -n default@%h
    volumes:
      - ./backend:/app
      - media_files:/app/media
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DB_HOST=db
      - DB_NAME=${DB_NAME:?set DB_NAME in the repo-root .env}
      - DB_USER=${DB_USER:?set DB_USER in the repo-root .env}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in the repo-root .env}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-extraction:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENT_FILE: development.txt
    restart: unless-stopped
    command: celery -A config worker -l info -Q extraction -n extraction@%h --concurrency=2
    volumes:
      - ./backend:/app
      - media_files:/app/media
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DB_HOST=db
      - DB_NAME=${DB_NAME:?set DB_NAME in the repo-root .env}
      - DB_USER=${DB_USER:?set DB_USER in the repo-root .env}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in the repo-root .env}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DOCLING_API_URL=http://docling:5001
      # Read by config.settings.base.DOCLING_TIMEOUT_SECONDS. Replaces
      # EXTRACTION_TIMEOUT, which was declared here and read by nothing.
      - DOCLING_TIMEOUT_SECONDS=900
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      docling:
        condition: service_healthy

  celery-embedding:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENT_FILE: development.txt
    restart: unless-stopped
    command: celery -A config worker -l info -Q embedding -n embedding@%h --concurrency=4
    volumes:
      - ./backend:/app
      - media_files:/app/media
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DB_HOST=db
      - DB_NAME=${DB_NAME:?set DB_NAME in the repo-root .env}
      - DB_USER=${DB_USER:?set DB_USER in the repo-root .env}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in the repo-root .env}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENT_FILE: development.txt
    restart: unless-stopped
    command: celery -A config beat -l info --schedule=/tmp/celerybeat-schedule
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DB_HOST=db
      - DB_NAME=${DB_NAME:?set DB_NAME in the repo-root .env}
      - DB_USER=${DB_USER:?set DB_USER in the repo-root .env}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in the repo-root .env}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  media_files:
