<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask IRIS · IRIS</title>
<meta name="description" content="Ask IRIS redesign prototype: a static, clickable proposal with invented sample data. Not connected to the live system.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Ask IRIS prototype. Tokens are DESIGN.md's, the same as styles.css beside this file.
   Type roles only (DESIGN.md): display 32 serif, title 20 serif, reading 16/1.75,
   body 15/24, control 14/20, label 13/20. Nothing smaller than 13 px.
   One icon set: stroked, 1.75 px, 20 px in controls and 16 px inline. */
:root {
  --maroon: #6b0f12; --maroon-light: #8b1316; --maroon-press: #5a0c0f; --maroon-thread: #f9b8b9;
  --hl: #f7e08f;
  --endpaper: #fafaf9; --page: #ffffff; --bar: #f5f5f4; --desk: #e7e5e4; --rule: #d6d3d1; --field: #8f8884;
  --ink: #1c1917; --body: #44403c; --quiet: #57534e; --faint: #78716c;
  --serif: "EB Garamond", Georgia, Cambria, serif;
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-thumb: 6px; --r-control: 12px; --r-sheet: 16px; --r-pill: 999px;
  --float: 0 12px 32px rgb(41 37 36 / .16), 0 2px 6px rgb(41 37 36 / .06);
  --ease: cubic-bezier(.22, 1, .36, 1);
  --proto: 52px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #d6d3d1; color: var(--body); font: 400 15px/24px var(--sans); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
a { color: var(--maroon); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--maroon); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
svg.i.s16 { width: 16px; height: 16px; }

/* ---------- Prototype bar (not part of the design) ---------- */
.proto { position: sticky; top: 0; z-index: 50; height: var(--proto); display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #1c1917; color: #e7e5e4; font-size: 13px; overflow-x: auto; }
.proto b { color: #fff; font-weight: 600; white-space: nowrap; }
.proto .grp { display: flex; gap: 4px; padding: 3px; background: #292524; border-radius: 10px; }
.proto button { border: 0; background: transparent; color: #d6d3d1; padding: 5px 10px; border-radius: 7px; white-space: nowrap; font-size: 13px; }
.proto button[aria-pressed="true"] { background: #fafaf9; color: #1c1917; font-weight: 600; }
.proto .note { margin-left: auto; color: #a8a29e; white-space: nowrap; }

/* ---------- Stage: the device frame. Layout keys off its width, not the window's. ---------- */
.stage-wrap { display: flex; justify-content: center; padding: 0; height: calc(100% - var(--proto)); }
.stage { container-type: inline-size; width: 100%; height: 100%; background: var(--page); overflow: hidden; position: relative; }
.stage-wrap.tablet { padding: 20px; } .stage-wrap.tablet .stage { width: 900px; border-radius: 14px; box-shadow: var(--float); }
.stage-wrap.phone { padding: 20px; } .stage-wrap.phone .stage { width: 375px; max-height: 812px; border-radius: 28px; box-shadow: var(--float); }

.app { --pane: 272px; display: grid; grid-template-columns: 232px var(--pane) minmax(0, 1fr) auto; height: 100%; transition: grid-template-columns .22s var(--ease); }
.app.pane-closed { --pane: 60px; }
@media (prefers-reduced-motion: reduce) { .app { transition: none; } }

/* App sidebar (as in IRIS today, shown for context) */
.nav { display: flex; flex-direction: column; border-right: 1px solid var(--desk); background: var(--page); padding: 14px 12px; gap: 2px; }
.nav .brand { display: flex; align-items: center; gap: 8px; padding: 2px 8px 14px; }
.nav .brand .glyph { width: 26px; height: 26px; }
.nav .brand span { font: 600 20px/1 var(--serif); letter-spacing: .14em; color: var(--maroon); }
.nav a { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 10px; border-radius: var(--r-control); color: var(--body); text-decoration: none; font-size: 14px; }
.nav a:hover { background: var(--bar); }
.nav a[aria-current="page"] { background: var(--desk); color: var(--ink); font-weight: 600; }
.nav a[aria-current="page"] svg { color: var(--maroon); }
.nav .who { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px 2px; border-top: 1px solid var(--desk); font-size: 14px; color: var(--ink); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--maroon); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 600; flex: none; }
.who small { display: block; font-size: 13px; color: var(--quiet); line-height: 18px; }

/* History pane */
.history { position: relative; min-height: 0; overflow: hidden; background: var(--endpaper); border-right: 1px solid var(--desk); }
/* Fixed inner width, so the list doesn't reflow while the column animates. */
.history .full { width: 272px; height: 100%; display: flex; flex-direction: column; }
.history .rail { display: none; width: 60px; height: 100%; flex-direction: column; align-items: center; }
.app.pane-closed .history .full { display: none; }
.app.pane-closed .history .rail { display: flex; }
.app.pane-closed .history { overflow: visible; z-index: 5; } /* lets the rail's tooltips show beside it */
/* The toggle never moves: top-left of the pane, open or closed, on the thread header's line. */
.pane-bar { display: flex; align-items: center; gap: 4px; height: 60px; flex: none; padding: 0 12px; border-bottom: 1px solid var(--desk); }
.pane-bar p { flex: 1; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--ink); }
.rail .pane-bar { width: 100%; justify-content: center; padding: 0; }
.rail-tools { display: grid; gap: 4px; padding-top: 12px; }
.pane-toggle[aria-expanded="true"] { color: var(--ink); }
.tip { position: relative; }
.tip:hover::after, .tip:focus-visible::after { content: attr(data-tip); position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%); z-index: 30; padding: 4px 10px; border-radius: 8px; background: var(--ink); color: #fff; font-size: 13px; line-height: 20px; font-weight: 500; white-space: nowrap; pointer-events: none; }
.history-head { display: grid; gap: 10px; padding: 12px 12px 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: var(--r-pill); border: 1px solid transparent; font-size: 14px; font-weight: 600; white-space: nowrap; text-decoration: none; }
.btn-primary { background: var(--maroon); color: #fff; }
.btn-primary:hover { background: var(--maroon-light); }
.btn-primary:active { background: var(--maroon-press); }
.btn-secondary { background: var(--page); color: var(--body); border-color: var(--field); }
.btn-secondary:hover { background: var(--bar); }
.btn-ghost { background: transparent; color: var(--body); padding: 0 12px; }
.btn-ghost:hover { background: var(--bar); }
.btn[disabled] { background: var(--desk); color: var(--quiet); border-color: transparent; cursor: not-allowed; }
.history .btn-primary { width: 100%; }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 10px; color: var(--quiet); }
.search input { width: 100%; height: 40px; padding: 0 56px 0 38px; border: 1px solid var(--field); border-radius: var(--r-control); background: var(--page); font-size: 14px; }
.search input::placeholder { color: var(--faint); }
.search kbd { position: absolute; right: 8px; top: 9px; padding: 0 6px; border: 1px solid var(--rule); border-radius: 6px; font: 500 13px/20px var(--sans); color: var(--quiet); background: var(--bar); }
.history-list { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
.group { padding: 14px 10px 4px; font-size: 13px; line-height: 20px; font-weight: 600; color: var(--quiet); }
.row { position: relative; display: flex; align-items: center; border-radius: var(--r-control); }
.row:hover, .row:focus-within { background: var(--bar); }
.row[aria-current="true"] { background: var(--desk); }
.row a { flex: 1; min-width: 0; display: block; padding: 8px 10px; color: var(--ink); text-decoration: none; font-size: 14px; line-height: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .pin { color: var(--quiet); margin-left: 10px; }
.row .more { opacity: 0; }
.row:hover .more, .row:focus-within .more, .row[aria-current="true"] .more { opacity: 1; }
@media (hover: none) { .row .more { opacity: 1; } }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; flex: none; border: 0; border-radius: 10px; background: transparent; color: var(--quiet); }
.icon-btn:hover { background: var(--desk); color: var(--ink); }
.history-note { margin: 8px 10px; font-size: 14px; line-height: 20px; color: var(--quiet); }
.inline-error { margin: 10px 6px; padding: 12px; border: 1px solid var(--rule); border-radius: var(--r-control); background: var(--page); display: grid; gap: 10px; }
.inline-error p { display: flex; gap: 10px; font-size: 14px; line-height: 20px; color: var(--ink); }
.inline-error p svg { color: var(--maroon); margin-top: 0; }
.inline-error .btn { justify-self: start; height: 36px; }

/* Thread */
.thread { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--page); }
.thread-head { display: flex; align-items: center; gap: 8px; height: 60px; padding: 0 16px 0 20px; border-bottom: 1px solid var(--desk); }
.thread-head h1 { flex: 1; min-width: 0; font: 600 20px/28px var(--serif); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thread-head .show-history, .thread-head .show-nav, .thread-head .phone-new { display: none; }
.thread-body { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
.col { width: 100%; max-width: 720px; margin: 0 auto; padding: 28px 24px 24px; }

.empty { display: grid; justify-items: center; text-align: center; gap: 14px; padding-top: 10vh; }
.empty .glyph { width: 48px; height: 48px; }
.empty h2 { font: 600 32px/38px var(--serif); color: var(--ink); text-wrap: balance; }
.empty p { max-width: 50ch; color: var(--quiet); }
.starters { width: 100%; margin-top: 18px; display: grid; gap: 8px; text-align: left; }
.starter { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 1px solid var(--rule); border-radius: var(--r-control); background: var(--page); color: var(--ink); font-size: 15px; line-height: 22px; text-align: left; }
.starter:hover { border-color: var(--field); background: var(--endpaper); }
.starter svg { color: var(--maroon); }
.starter span { flex: 1; }

.turn { display: grid; gap: 14px; margin-bottom: 36px; }
.q { justify-self: end; max-width: 85%; padding: 10px 16px; border-radius: 18px 18px 6px 18px; background: var(--bar); color: var(--ink); font-size: 15px; line-height: 24px; }
.q-actions { justify-self: end; display: flex; gap: 2px; margin-top: -8px; }
.a { font-size: 16px; line-height: 1.75; color: var(--body); }
.a p + p, .a p + ul, .a ul + p { margin-top: .75em; }
.a ul { margin: .5em 0 0; padding-left: 1.2em; }
.a li + li { margin-top: .35em; }
.a li::marker { color: var(--maroon); }
.a b { color: var(--ink); font-weight: 600; }
.cite { display: inline-flex; align-items: center; height: 22px; margin: 0 1px; padding: 0 7px; border: 0; border-radius: var(--r-thumb); background: var(--page); box-shadow: inset 0 0 0 1px var(--rule); color: var(--maroon); font-size: 13px; font-weight: 600; line-height: 22px; vertical-align: 1px; }
.nw { white-space: nowrap; }
.cite:hover, .cite[aria-pressed="true"] { background: var(--maroon); color: #fff; box-shadow: none; }
.a-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: -2px; }
.a-meta .count { margin-right: auto; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 10px; border: 1px solid var(--rule); border-radius: var(--r-pill); background: var(--page); color: var(--body); font-size: 14px; font-weight: 500; }
.a-meta .count:hover { background: var(--bar); }
.a-meta .count svg { color: var(--maroon); }
.notice { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--r-control); background: var(--bar); color: var(--body); font-size: 14px; line-height: 20px; }
.notice svg { color: var(--quiet); }

/* Research progress: one quiet block, no card. */
.progress { display: grid; gap: 10px; padding: 2px 0 2px 16px; border-left: 2px solid var(--maroon-thread); }
.progress-head { display: flex; align-items: center; gap: 10px; color: var(--ink); font-weight: 600; font-size: 15px; }
.spinner { width: 16px; height: 16px; border: 2px solid var(--desk); border-top-color: var(--maroon); border-radius: 50%; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; border-top-color: var(--maroon); } * { scroll-behavior: auto !important; } }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; line-height: 20px; color: var(--quiet); }
.steps li { display: flex; gap: 10px; align-items: center; }
.steps li.done svg { color: var(--maroon); }
.steps li.now { color: var(--ink); }
.steps li.next { color: var(--faint); }
.steps .dot { width: 16px; height: 16px; display: grid; place-items: center; }
.steps .dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--rule); }

/* Composer */
.composer { padding: 8px 24px 16px; }
.composer-in { max-width: 720px; margin: 0 auto; }
.box { border: 1px solid var(--field); border-radius: var(--r-sheet); background: var(--page); padding: 10px 10px 8px 16px; transition: border-color .15s, box-shadow .15s; }
.box:focus-within { border-color: var(--maroon); box-shadow: inset 0 0 0 1px var(--maroon); }
.box textarea { display: block; width: 100%; min-height: 28px; max-height: 180px; border: 0; outline: 0; resize: none; background: transparent; font-size: 16px; line-height: 26px; color: var(--ink); }
.box textarea::placeholder { color: var(--faint); }
.box-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.depth { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px 0 8px; border: 0; border-radius: var(--r-pill); background: var(--bar); color: var(--body); font-size: 14px; font-weight: 500; }
.depth:hover { background: var(--desk); }
.send { margin-left: auto; display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--maroon); color: #fff; }
.send:hover { background: var(--maroon-light); }
.send[disabled] { background: var(--desk); color: var(--faint); cursor: not-allowed; }
.send.stop { background: var(--ink); }
.disclaimer { margin-top: 8px; text-align: center; font-size: 13px; line-height: 20px; color: var(--quiet); }
.box.off { background: var(--bar); border-color: var(--rule); }

/* Menus */
.menu { position: absolute; z-index: 30; min-width: 240px; padding: 6px; border: 1px solid var(--desk); border-radius: var(--r-control); background: var(--page); box-shadow: var(--float); }
.menu button { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; font-size: 14px; line-height: 20px; color: var(--ink); }
.menu button:hover, .menu button:focus-visible { background: var(--bar); outline: 0; }
.menu button small { display: block; font-size: 13px; color: var(--quiet); }
.menu button svg { margin-top: 0; color: var(--quiet); }
.menu button[aria-checked="true"] svg.tick { color: var(--maroon); }
.menu .danger { color: var(--maroon); }
.menu .danger svg { color: var(--maroon); }
.menu hr { border: 0; border-top: 1px solid var(--desk); margin: 6px 4px; }

/* Sources panel */
.sources { width: 380px; display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--desk); background: var(--endpaper); }
.sources[hidden] { display: none; }
.sources-head { display: flex; align-items: center; gap: 8px; height: 60px; padding: 0 12px 0 20px; border-bottom: 1px solid var(--desk); }
.sources-head h2 { flex: 1; font-size: 15px; line-height: 24px; font-weight: 600; color: var(--ink); }
.sources-head h2 span { font-weight: 400; color: var(--quiet); }
.sources-list { flex: 1; overflow-y: auto; padding: 12px; display: grid; gap: 10px; align-content: start; }
.src { padding: 14px; border: 1px solid var(--desk); border-radius: var(--r-control); background: var(--page); display: grid; gap: 8px; scroll-margin: 12px; }
.src.on { border-color: var(--maroon); box-shadow: inset 0 0 0 1px var(--maroon); }
.src-top { display: flex; gap: 10px; align-items: baseline; }
.src-n { flex: none; display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: var(--r-thumb); background: var(--maroon); color: #fff; font-size: 13px; font-weight: 600; }
.src h3 { font: 600 17px/22px var(--serif); color: var(--ink); }
.src-meta { font-size: 13px; line-height: 20px; color: var(--quiet); }
.src blockquote { margin: 0; padding-left: 12px; border-left: 2px solid var(--rule); font-size: 14px; line-height: 22px; color: var(--body); }
.src mark { background: var(--hl); color: var(--ink); padding: 0 1px; }
.src a { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; text-decoration: none; }
.src a:hover { text-decoration: underline; }

/* Full-state notices (unavailable, earlier conversation) */
.state-card { display: grid; justify-items: center; text-align: center; gap: 12px; max-width: 520px; margin: 12vh auto 0; }
.state-card .ico { width: 48px; height: 48px; border-radius: 50%; background: var(--bar); display: grid; place-items: center; color: var(--maroon); }
.state-card h2 { font: 600 28px/34px var(--serif); color: var(--ink); text-wrap: balance; }
.state-card p { color: var(--quiet); }
.admin-note { width: 100%; margin-top: 8px; text-align: left; border: 1px solid var(--rule); border-radius: var(--r-control); background: var(--page); }
.admin-note summary { padding: 10px 14px; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer; }
.admin-note div { padding: 0 14px 12px; font-size: 14px; line-height: 22px; color: var(--body); }
.admin-note code { font: 500 13px/20px ui-monospace, Consolas, monospace; background: var(--bar); padding: 1px 5px; border-radius: 4px; }
.banner { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 24px; border-radius: var(--r-control); background: var(--bar); font-size: 14px; line-height: 20px; color: var(--body); }
.banner svg { color: var(--quiet); }
.banner span { flex: 1; }
.banner .btn { height: 36px; }

.scrim { display: none; }
.toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 40; padding: 10px 16px; border-radius: var(--r-pill); background: var(--ink); color: #fff; font-size: 14px; box-shadow: var(--float); }

/* ---------- Tablet: app sidebar shrinks to icons; conversations still push the chat; sources overlay ---------- */
@container (max-width: 1180px) {
  .app { grid-template-columns: 72px var(--pane) minmax(0, 1fr) auto; }
  .nav { padding: 14px 8px; align-items: center; }
  .nav .brand span, .nav a span, .nav .who > div { display: none; }
  .nav a { width: 48px; justify-content: center; padding: 0; }
  .sources { position: absolute; z-index: 20; top: 0; right: 0; bottom: 0; width: min(380px, 90%); box-shadow: var(--float); }
  .app.sources-open .scrim { display: block; position: absolute; inset: 0; z-index: 15; background: rgb(28 25 23 / .28); }
}
/* ---------- Phone: no app sidebar; a top bar; sources as a bottom sheet ---------- */
@container (max-width: 640px) {
  /* No room to push a column on a phone, so here, and only here, the pane slides over the chat. */
  .app, .app.pane-closed { grid-template-columns: minmax(0, 1fr); }
  .nav { display: none; }
  .history { position: absolute; z-index: 20; top: 0; bottom: 0; left: 0; width: min(320px, 88%); box-shadow: var(--float); transform: translateX(-105%); transition: transform .25s var(--ease); border-right: 0; }
  .history .full, .app.pane-closed .history .full { display: flex; width: 100%; }
  .history .rail, .app.pane-closed .history .rail { display: none; }
  .app.history-open .history { transform: none; }
  .app.history-open .scrim { display: block; position: absolute; inset: 0; z-index: 15; background: rgb(28 25 23 / .28); }
  .thread-head .show-history, .thread-head .phone-new { display: inline-grid; }
  .pane-bar { height: 56px; }
  .search kbd { display: none; }
  .search input { padding-right: 12px; }
  .thread-head { height: 56px; padding: 0 8px; gap: 4px; }
  .thread-head h1 { font-size: 18px; }
  .thread-head .show-nav { display: inline-grid; }
  .thread-head .hide-phone { display: none; }
  .col { padding: 20px 16px 16px; }
  .empty { padding-top: 4vh; }
  .empty h2 { font-size: 28px; line-height: 34px; }
  .starter { padding: 12px; }
  .composer { padding: 6px 12px 12px; }
  .icon-btn { width: 44px; height: 44px; }
  .q { max-width: 92%; }
  .sources { top: auto; left: 0; width: 100%; height: 72%; border-left: 0; border-radius: 20px 20px 0 0; }
  .sources-head { height: 56px; }
  .state-card { margin-top: 6vh; padding: 0 4px; }
  .state-card h2 { font-size: 24px; line-height: 30px; }
  .banner { flex-wrap: wrap; }
}
</style>
</head>

<div class="proto" role="region" aria-label="Prototype controls (not part of the design)">
  <b>Ask IRIS prototype</b>
  <div class="grp" role="group" aria-label="State">
    <button type="button" data-state="new">New conversation</button>
    <button type="button" data-state="answering">Answering</button>
    <button type="button" data-state="answer">Answer + sources</button>
    <button type="button" data-state="listfail">List failed</button>
    <button type="button" data-state="unavailable">Ask IRIS not set up</button>
    <button type="button" data-state="earlier">Earlier conversation</button>
  </div>
  <div class="grp" role="group" aria-label="Width">
    <button type="button" data-vp="desktop">Desktop</button>
    <button type="button" data-vp="tablet">Tablet</button>
    <button type="button" data-vp="phone">Phone</button>
  </div>
  <span class="note">Invented sample data · nothing is sent</span>
</div>

<div class="stage-wrap" id="wrap"><div class="stage" id="stage"></div></div>

<script>
/* ------------------------------------------------------------------ data (invented) */
const PAPERS = {
  101: { title: "Predicting Student Absenteeism", by: "Zozobrado & Abac · 2026" },
  109: { title: "Perceived Usability of the CIT-U Learning Management System Among First-Year Students", by: "Santos · 2026" },
  107: { title: "Forecasting Dengue Incidence in Cebu City from Weather and Mobility Data", by: "Ybañez & Lim · 2025" },
};
const SOURCES = [
  { n: 1, paper: 101, page: 27, quote: "Of the four models compared, <mark>gradient boosting achieved the highest F1 score (0.81)</mark> on the held-out 2025 cohort, ahead of random forest (0.77) and logistic regression (0.71)." },
  { n: 2, paper: 101, page: 24, quote: "<mark>Previous-term absences were the strongest single predictor</mark>, accounting for 38% of the model's total feature importance." },
  { n: 3, paper: 101, page: 25, quote: "First-quarter grades and <mark>commuting distance above 8 km</mark> each added measurable predictive value once prior absences were controlled for." },
  { n: 4, paper: 109, page: 41, quote: "Students who logged in to the learning system fewer than twice a week <mark>missed 1.6 more class days per month</mark> on average than weekly users." },
];
let CONVOS = [
  { id: 1, g: "Pinned", title: "What predicts chronic absenteeism?", pinned: true },
  { id: 2, g: "Today", title: "Dengue forecasting methods used at CIT-U" },
  { id: 3, g: "Previous 7 days", title: "Papers that used the System Usability Scale" },
  { id: 4, g: "Previous 7 days", title: "IoT projects in aquaculture" },
  { id: 5, g: "Older", title: "Compare land-suitability forecasting methods" },
];
const QUESTION = "What predicts chronic absenteeism among senior high school students?";
const STARTERS = [
  "What predicts chronic absenteeism among senior high school students?",
  "Which theses used IoT sensors, and what did they measure?",
  "Compare the methods of the dengue forecasting papers",
];
const DEPTHS = [
  { v: "Standard", icon: "search", d: "A shorter search for a quicker answer" },
  { v: "Thorough", icon: "book", d: "Searches and reads more before answering" },
];

/* ------------------------------------------------------------------ state */
const S = { state: "new", vp: "desktop", sources: false, active: null, history: false, pane: readPane(), depth: "Standard", q: "", menu: null, draft: "" };
const $ = (s, el = document) => el.querySelector(s);
const ic = (n, cls = "") => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let timers = [];
/* The open/closed choice is remembered per browser; if storage is blocked the pane just starts open. */
function readPane() { try { return localStorage.getItem("askIris.pane") !== "closed"; } catch { return true; } }
function savePane() { try { localStorage.setItem("askIris.pane", S.pane ? "open" : "closed"); } catch { /* fine */ } }
function isPhone() { const st = document.getElementById("stage"); return !!st && st.clientWidth <= 640; }

/* ------------------------------------------------------------------ views */
function nav() {
  return `<nav class="nav" aria-label="Main">
    <div class="brand"><svg class="glyph" aria-hidden="true"><use href="#g-mark"/></svg><span>IRIS</span></div>
    <a href="#">${ic("compass")}<span>Discover</span></a>
    <a href="#" aria-current="page"><svg class="glyph" width="20" height="20" aria-hidden="true"><use href="#g-ask"/></svg><span>Ask IRIS</span></a>
    <a href="#">${ic("library")}<span>My Library</span></a>
    <a href="#">${ic("megaphone")}<span>Calls &amp; Conferences</span></a>
    <div class="who"><span class="avatar">SS</span><div>Sam Student<small>Student</small></div></div>
  </nav>`;
}

function history() {
  const unavailable = S.state === "unavailable";
  const current = S.state === "answer" || S.state === "answering" ? 1 : S.state === "earlier" ? 99 : null;
  let body;
  if (S.state === "listfail") {
    body = `<div class="inline-error" role="alert"><p>${ic("alert", "s16")}<span>IRIS couldn’t load your conversations. Your new questions still work.</span></p>
      <button class="btn btn-secondary" type="button" data-act="retry-list">${ic("rotate", "s16")}Try again</button></div>`;
  } else if (unavailable) {
    body = `<p class="history-note">Your conversations will show here once Ask IRIS is available.</p>`;
  } else {
    const shown = CONVOS.filter((c) => !S.q || c.title.toLowerCase().includes(S.q.toLowerCase()));
    let last = "";
    body = shown.length ? shown.map((c) => {
      const g = c.g !== last ? `<p class="group">${c.g}</p>` : ""; last = c.g;
      return `${g}<div class="row" ${c.id === current ? 'aria-current="true"' : ""}>
        <a href="#" data-act="open" data-id="${c.id}" ${c.id === current ? 'aria-current="page"' : ""}>${esc(c.title)}</a>
        <button class="icon-btn more" type="button" data-act="row-menu" data-id="${c.id}" aria-haspopup="menu" aria-label="More for ${esc(c.title)}">${ic("more")}</button></div>`;
    }).join("") : `<p class="history-note">No conversations match “${esc(S.q)}”.</p>`;
    if (S.state === "earlier" && !S.q) body += `<p class="group">Earlier conversations</p><div class="row" aria-current="true"><a href="#" aria-current="page">Usability papers in the College of Computer Studies</a></div>`;
  }
  const phone = isPhone();
  const open = phone ? S.history : S.pane;
  const toggle = (where) => `<button class="icon-btn pane-toggle tip" type="button" data-act="pane" aria-expanded="${open}" aria-controls="conv-pane"
      aria-label="${where === "rail" ? "Show conversations" : phone ? "Close conversations" : "Hide conversations"}" data-tip="${where === "rail" ? "Show conversations" : "Hide conversations"}">${ic(phone && where !== "rail" ? "x" : "panel-left")}</button>`;
  return `<aside class="history" id="conv-pane" aria-label="Conversations">
    <div class="rail">
      <div class="pane-bar">${toggle("rail")}</div>
      <div class="rail-tools">
        <button class="icon-btn tip" type="button" data-act="new" data-tip="New conversation" aria-label="New conversation" ${unavailable ? "disabled" : ""}>${ic("msg-plus")}</button>
        ${unavailable ? "" : `<button class="icon-btn tip" type="button" data-act="rail-search" data-tip="Search conversations (Ctrl K)" aria-label="Search conversations">${ic("search")}</button>`}
      </div>
    </div>
    <div class="full">
    <div class="pane-bar">${phone ? "" : toggle("full")}<p>Conversations</p>${phone ? toggle("full") : ""}</div>
    <div class="history-head">
      <button class="btn btn-primary" type="button" data-act="new" ${unavailable ? "disabled" : ""}>${ic("msg-plus")}New conversation</button>
      ${unavailable ? "" : `<div class="search">${ic("search", "s16")}<label class="sr-only" for="conv-q">Search your conversations</label><input id="conv-q" type="search" placeholder="Search conversations" value="${esc(S.q)}" ${S.state === "listfail" ? "disabled" : ""}><kbd aria-hidden="true">Ctrl K</kbd></div>`}
    </div>
    <div class="history-list">${body}</div>
    </div>
  </aside>`;
}

function head() {
  const title = { new: "Ask IRIS", listfail: "Ask IRIS", unavailable: "Ask IRIS", answering: QUESTION, answer: "What predicts chronic absenteeism?", earlier: "Usability papers in the College of Computer Studies" }[S.state];
  const own = S.state === "answer";
  return `<header class="thread-head">
    <button class="icon-btn show-nav" type="button" aria-label="Open menu" data-act="toast" data-msg="Opens the IRIS menu">${ic("menu")}</button>
    <button class="icon-btn show-history" type="button" data-act="pane" aria-expanded="${S.history}" aria-controls="conv-pane" aria-label="Show conversations">${ic("panel-left")}</button>
    <h1 id="thread-h">${esc(title)}</h1>
    ${own ? `<button class="icon-btn" type="button" data-act="sources" aria-expanded="${S.sources}" aria-controls="sources" aria-label="${S.sources ? "Hide" : "Show"} sources" title="Sources">${ic("panel")}</button>
      <button class="icon-btn" type="button" data-act="row-menu" data-id="1" aria-haspopup="menu" aria-label="More for this conversation">${ic("more")}</button>` : ""}
    ${/* Phone only, where the pane is hidden: one New conversation on screen at a time, and none while you're already in one. */
      ["answer", "answering", "earlier"].includes(S.state) ? `<button class="icon-btn phone-new" type="button" data-act="new" aria-label="New conversation" title="New conversation">${ic("msg-plus")}</button>` : ""}
  </header>`;
}

function answerHtml() {
  const c = (n) => `<button class="cite" type="button" data-act="cite" data-n="${n}" aria-pressed="${S.active === n}" aria-label="Source ${n}: ${esc(PAPERS[SOURCES[n - 1].paper].title)}, page ${SOURCES[n - 1].page}">${n}</button>`;
  return `<div class="a">
    <p>Gradient boosting predicted chronic absenteeism best, with an F1 score of 0.81 on the held-out <span class="nw">cohort ${c(1)}.</span></p>
    <ul>
      <li><b>Previous-term absences</b> were the strongest single <span class="nw">predictor ${c(2)}.</span></li>
      <li><b>First-quarter grades</b> and <b>a commute over 8 km</b> added to it once prior absences were <span class="nw">counted ${c(3)}.</span></li>
    </ul>
    <p>One other paper points the same way from a different angle: first-year students who rarely used the learning system missed more class <span class="nw">days ${c(4)}.</span></p>
  </div>
  <div class="a-meta">
    <button class="count" type="button" data-act="sources" aria-expanded="${S.sources}" aria-controls="sources">${ic("file", "s16")}4 passages from 2 papers</button>
    <button class="icon-btn" type="button" data-act="toast" data-msg="Answer copied" aria-label="Copy answer" title="Copy answer">${ic("copy", "s16")}</button>
    <button class="icon-btn" type="button" data-act="ask" aria-label="Ask again" title="Ask again">${ic("rotate", "s16")}</button>
  </div>`;
}

function thread() {
  let body = "";
  if (S.state === "new" || S.state === "listfail") {
    body = `<div class="empty">
      <svg class="glyph" aria-hidden="true"><use href="#g-ask"/></svg>
      <h2>Ask about research in IRIS</h2>
      <p>Answers come only from papers you can read, and each claim names the page it comes from.</p>
      <div class="starters" role="list" aria-label="Suggested questions">${STARTERS.map((s) => `<button class="starter" type="button" role="listitem" data-act="starter" data-v="${esc(s)}">${ic("arrow-right", "s16")}<span>${esc(s)}</span></button>`).join("")}</div>
    </div>`;
  } else if (S.state === "unavailable") {
    body = `<div class="state-card" role="status">
      <span class="ico">${ic("plug")}</span>
      <h2>Ask IRIS isn’t available on this server</h2>
      <p>IRIS can’t give Ask IRIS permission to read papers for you, so no question can be asked here yet. This is a setup problem, not something you did.</p>
      <a class="btn btn-secondary" href="#">${ic("compass", "s16")}Search papers in Discover</a>
      <details class="admin-note"><summary>For the team running IRIS</summary><div>Django refuses the reader grant because research grants are not configured: set <code>AI_RESEARCH_GRANTS</code> and the <code>AI_RESEARCH_GRANT_*</code> keys in <code>backend/.env</code>, then restart the backend. <br><span style="color:var(--quiet)">Prototype note: only a System Admin sees this box.</span></div></details>
    </div>`;
  } else if (S.state === "earlier") {
    body = `<div class="banner">${ic("lock", "s16")}<span>An earlier conversation, kept to read. To keep going, start a new conversation.</span></div>
      <div class="turn"><div class="q">Which usability papers came out of the College of Computer Studies?</div>
      <div class="a"><p>Two papers in the catalogue tested usability in the College of Computer Studies. The learning-system study scored it 61.4 on the System Usability Scale, below the benchmark of 68.</p></div></div>`;
  } else {
    const answering = S.state === "answering";
    body = `<div class="turn">
      <div class="q">${esc(QUESTION)}</div>
      ${answering ? "" : `<div class="q-actions"><button class="icon-btn" type="button" data-act="edit" aria-label="Edit this question" title="Edit">${ic("pencil", "s16")}</button><button class="icon-btn" type="button" data-act="toast" data-msg="Question copied" aria-label="Copy question" title="Copy question">${ic("copy", "s16")}</button></div>`}
      ${answering ? progress() : answerHtml()}
    </div>`;
  }
  return `<section class="thread" aria-labelledby="thread-h">
    ${head()}
    <div class="thread-body" id="tb"><div class="col" aria-live="polite">${body}</div></div>
    ${composer()}
  </section>`;
}

function progress() {
  const step = S.step || 0;
  const steps = ["Searching papers you can read", "Reading 4 passages from 2 papers", "Checking every citation against its page"];
  return `<section class="progress" aria-label="Research progress">
    <p class="progress-head"><span class="spinner" aria-hidden="true"></span>${S.depth === "Thorough" ? "Thorough research" : "Researching"}…</p>
    <ol class="steps">${steps.map((t, i) => `<li class="${i < step ? "done" : i === step ? "now" : "next"}">${i < step ? ic("check", "s16") : `<span class="dot"></span>`}${t}</li>`).join("")}</ol>
  </section>`;
}

function composer() {
  const off = S.state === "unavailable" || S.state === "earlier";
  const busy = S.state === "answering";
  const d = DEPTHS.find((x) => x.v === S.depth);
  const ph = S.state === "earlier" ? "This conversation is kept to read" : off ? "Ask IRIS isn’t available on this server" : "Ask a question about research in IRIS";
  return `<form class="composer" data-form="ask"><div class="composer-in">
    <div class="box ${off ? "off" : ""}"><label class="sr-only" for="ask-in">Ask IRIS a question</label>
      <textarea id="ask-in" rows="1" placeholder="${ph}" ${off ? "disabled" : ""}>${esc(S.draft)}</textarea>
      <div class="box-row">
        <button class="depth" type="button" data-act="depth" aria-haspopup="menu" aria-label="Research depth: ${d.v}" ${off ? "disabled" : ""}>${ic(d.icon, "s16")}${d.v}${ic("chev-down", "s16")}</button>
        ${busy ? `<button class="send stop" type="button" data-act="stop" aria-label="Stop research" title="Stop">${ic("square", "s16")}</button>`
               : `<button class="send" type="submit" aria-label="Send" ${off || !S.draft.trim() ? "disabled" : ""}>${ic("arrow-up")}</button>`}
      </div></div>
    ${off ? "" : `<p class="disclaimer">Ask IRIS can be wrong. Check the cited page.</p>`}
  </div></form>`;
}

function sources() {
  const on = S.state === "answer" && S.sources;
  return `<aside class="sources" id="sources" aria-label="Sources" ${on ? "" : "hidden"}>
    <div class="sources-head"><h2>Sources <span>· 4 passages from 2 papers</span></h2>
      <button class="icon-btn" type="button" data-act="sources" aria-label="Hide sources">${ic("x")}</button></div>
    <div class="sources-list">${SOURCES.map((s) => `<article class="src ${S.active === s.n ? "on" : ""}" id="src-${s.n}" aria-labelledby="src-h-${s.n}">
      <div class="src-top"><span class="src-n" aria-hidden="true">${s.n}</span><div><h3 id="src-h-${s.n}">${esc(PAPERS[s.paper].title)}</h3><p class="src-meta">${PAPERS[s.paper].by} · page ${s.page}</p></div></div>
      <blockquote>${s.quote}</blockquote>
      <a href="#" data-act="toast" data-msg="Opens the paper at page ${s.page}">Open at page ${s.page}${ic("arrow-right", "s16")}</a>
    </article>`).join("")}</div>
  </aside>`;
}

function render(focus) {
  const app = `<div class="app ${S.pane ? "" : "pane-closed"} ${S.history ? "history-open" : ""} ${S.state === "answer" && S.sources ? "sources-open" : ""}">
    ${nav()}${history()}${thread()}${sources()}<div class="scrim" data-act="scrim"></div></div>`;
  $("#stage").innerHTML = app;
  document.querySelectorAll("[data-state]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.state === S.state));
  document.querySelectorAll("[data-vp]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.vp === S.vp));
  $("#wrap").className = "stage-wrap " + S.vp;
  document.title = (S.state === "answer" ? "What predicts chronic absenteeism? · " : "") + "Ask IRIS · IRIS";
  const ta = $("#ask-in"); if (ta) autosize(ta);
  if (focus) { const el = $(focus); if (el) el.focus(); }
  if (S.active) { const el = $("#src-" + S.active); if (el) el.scrollIntoView({ block: "nearest" }); }
}

/* ------------------------------------------------------------------ behaviour */
function setState(st) { timers.forEach(clearTimeout); timers = []; S.state = st; S.menu = null; S.history = false; if (st !== "answer") { S.sources = false; S.active = null; } if (st === "answering") run(); }
function run() {
  S.step = 0;
  [900, 1900, 2900].forEach((t, i) => timers.push(setTimeout(() => { if (S.state !== "answering") return; if (i < 2) { S.step = i + 1; render(); } else { S.state = "answer"; render("#tb"); } }, t)));
}
function autosize(ta) { if (!ta.value) { ta.style.height = ""; return; } ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 180) + "px"; }
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.role = "status"; t.textContent = msg; $("#stage").append(t); setTimeout(() => t.remove(), 1800); }
function closeMenu() { const m = $(".menu"); if (m) m.remove(); if (S.menuFrom) { S.menuFrom.focus(); S.menuFrom = null; } }
function openMenu(from, html) {
  closeMenu();
  const m = document.createElement("div"); m.className = "menu"; m.setAttribute("role", "menu"); m.innerHTML = html;
  const stage = $("#stage").getBoundingClientRect(); const r = from.getBoundingClientRect();
  $("#stage").append(m);
  const mw = m.offsetWidth, mh = m.offsetHeight;
  let left = Math.min(r.left - stage.left, stage.width - mw - 8); left = Math.max(8, left);
  let top = r.bottom - stage.top + 4; if (top + mh > stage.height - 8) top = r.top - stage.top - mh - 4;
  m.style.left = left + "px"; m.style.top = top + "px";
  S.menuFrom = from; m.querySelector("button").focus();
}

document.addEventListener("click", (e) => {
  const st = e.target.closest("[data-state]"); if (st) { setState(st.dataset.state); render(); return; }
  const vp = e.target.closest("[data-vp]"); if (vp) { S.vp = vp.dataset.vp; S.history = false; render(); return; }
  if (!e.target.closest(".menu") && !e.target.closest("[aria-haspopup]")) closeMenu();
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (a.tagName === "A") e.preventDefault();
  switch (act) {
    case "new": setState("new"); S.draft = ""; render("#ask-in"); break;
    case "starter": S.draft = ""; setState("answering"); render(); break;
    case "open": setState(a.dataset.id === "1" ? "answer" : "answer"); render("#thread-h"); break;
    case "retry-list": setState("new"); render("#conv-q"); toast("Conversations loaded"); break;
    case "pane":
      if (isPhone()) { S.history = !S.history; render(S.history ? ".full .pane-toggle" : ".show-history"); }
      else { S.pane = !S.pane; savePane(); render(S.pane ? ".full .pane-toggle" : ".rail .pane-toggle"); }
      break;
    case "rail-search": S.pane = true; savePane(); render("#conv-q"); break;
    case "scrim": S.history = false; S.sources = false; S.active = null; render(); break;
    case "sources": S.sources = !S.sources; if (!S.sources) S.active = null; render(S.sources ? ".sources .icon-btn" : null); break;
    case "cite": { const n = Number(a.dataset.n); S.sources = true; S.active = S.active === n && S.sources ? null : n; render(); break; }
    case "ask": setState("answering"); render(); break;
    case "edit": S.draft = QUESTION; render("#ask-in"); break;
    case "stop": setState("new"); S.draft = QUESTION; render("#ask-in"); toast("Stopped. Your question is back in the box."); break;
    case "toast": toast(a.dataset.msg); break;
    case "depth": openMenu(a, DEPTHS.map((d) => `<button type="button" role="menuitemradio" aria-checked="${d.v === S.depth}" data-act="pick-depth" data-v="${d.v}">${ic(d.icon)}<span>${d.v}<small>${d.d}</small></span>${d.v === S.depth ? ic("check", "s16 tick") : ""}</button>`).join("")); break;
    case "pick-depth": S.depth = a.dataset.v; S.menuFrom = null; closeMenu(); render(".depth"); break;
    case "row-menu": { const c = CONVOS.find((x) => x.id === Number(a.dataset.id)); openMenu(a, `<button type="button" role="menuitem" data-act="m-rename" data-id="${c.id}">${ic("pencil", "s16")}Rename</button>
        <button type="button" role="menuitem" data-act="m-pin" data-id="${c.id}">${ic("pin", "s16")}${c.pinned ? "Unpin" : "Pin"}</button><hr>
        <button type="button" role="menuitem" class="danger" data-act="m-delete" data-id="${c.id}">${ic("trash", "s16")}Delete…</button>`); break; }
    case "m-rename": { const c = CONVOS.find((x) => x.id === Number(a.dataset.id)); const t = prompt("Rename conversation", c.title); S.menuFrom = null; closeMenu(); if (t && t.trim()) { c.title = t.trim(); render(); } break; }
    case "m-pin": { const c = CONVOS.find((x) => x.id === Number(a.dataset.id)); c.pinned = !c.pinned; c.g = c.pinned ? "Pinned" : "Today"; CONVOS.sort((x, y) => (y.pinned ? 1 : 0) - (x.pinned ? 1 : 0)); S.menuFrom = null; closeMenu(); render(); toast(c.pinned ? "Pinned" : "Unpinned"); break; }
    case "m-delete": { const c = CONVOS.find((x) => x.id === Number(a.dataset.id)); S.menuFrom = null; closeMenu(); if (confirm(`Delete “${c.title}”? This can’t be undone.`)) { CONVOS = CONVOS.filter((x) => x !== c); if (c.id === 1 && S.state === "answer") setState("new"); render(); toast("Conversation deleted"); } break; }
  }
});
document.addEventListener("submit", (e) => { e.preventDefault(); if (!S.draft.trim()) return; S.draft = ""; setState("answering"); render(); });
document.addEventListener("input", (e) => {
  if (e.target.id === "ask-in") { S.draft = e.target.value; autosize(e.target); const s = $(".send:not(.stop)"); if (s) s.disabled = !S.draft.trim(); }
  if (e.target.id === "conv-q") { S.q = e.target.value; const pos = e.target.selectionStart; render("#conv-q"); const i = $("#conv-q"); i.setSelectionRange(pos, pos); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if ($(".menu")) { closeMenu(); return; } if (S.sources || S.history) { S.sources = false; S.history = false; S.active = null; render(); } }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if (isPhone()) { S.history = true; render(); } else if (!S.pane) { S.pane = true; savePane(); render(); } const q = $("#conv-q"); if (q) q.focus(); }
  if (e.target.id === "ask-in" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); e.target.form.requestSubmit(); }
  const m = $(".menu"); if (m && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); const items = [...m.querySelectorAll("button")]; const i = items.indexOf(document.activeElement); items[(i + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length].focus(); }
});

const init = new URLSearchParams(location.search);
if (init.get("state")) S.state = init.get("state");
if (init.get("vp")) S.vp = init.get("vp");
if (S.state === "answering") run();
render();
</script>
</body>
</html>
