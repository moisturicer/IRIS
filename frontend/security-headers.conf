# Browser security headers for the responses nginx serves itself (IR-663).
#
# Included by every location in nginx.conf that serves files, never at server
# level: nginx drops inherited add_header lines from any location that sets one
# of its own, and the asset location sets Cache-Control. Proxied locations do
# not include it either, because Django sends the same headers on its responses
# (config/settings/base.py) and nginx would send them twice.
#
# `always`, so a 404 carries them too.
#
# The CSP allows only what the built app loads:
#   script-src   the Vite bundle, from this origin. No inline script: the built
#                index.html has none.
#   style-src    the bundle's CSS, plus Font Awesome's stylesheet on cdnjs
#                (index.html).
#   style-src-attr 'unsafe-inline'
#                KaTeX writes style="..." attributes into the HTML that
#                PassageQuote inserts. This allows attributes only, never a
#                <style> element, and no script.
#   font-src     the bundled Inter, EB Garamond and KaTeX fonts, and Font
#                Awesome's webfonts on cdnjs. data: because Vite inlines the
#                smallest KaTeX font (KaTeX_Size3) into the CSS as a data: URL.
#   img-src      blob: for profile photos.
#   connect-src  the API and Ask IRIS's stream, both proxied by this server.
#   worker-src   pdf.js's worker, a bundled file on this origin.
#
# Report-only until the manual walk-through in docs/testing/TRACEABILITY.md
# (IR-663) shows no violation; enforcing also flips Django's
# CONTENT_SECURITY_POLICY_REPORT_ONLY. Browsers ignore frame-ancestors in a
# report-only policy, so X-Frame-Options is what denies framing until then.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' https://cdnjs.cloudflare.com; style-src-attr 'unsafe-inline'; font-src 'self' data: https://cdnjs.cloudflare.com; img-src 'self' blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
