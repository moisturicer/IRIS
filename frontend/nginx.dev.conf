# Development edge: the same routing as production (nginx.conf), with Vite
# behind it so hot reload keeps working. Open http://localhost:8080, not :5173.
# Ask IRIS goes through runtime-edge.conf exactly as it does in production.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 55m;

    include /etc/nginx/iris/runtime-edge.conf;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location ^~ /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location ^~ /django-admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Everything else is the Vite dev server, including its HMR websocket.
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $iris_vite frontend:5173;
        proxy_pass http://$iris_vite;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
