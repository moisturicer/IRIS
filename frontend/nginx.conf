# Log paths without query strings, and redact the retired verification URLs.
map $uri $safe_request_path {
    default $uri;
    ~^/(api/v1/auth/)?activate/ /activate/[redacted];
}
log_format iris_safe '$remote_addr "$request_method $safe_request_path $server_protocol" $status $body_bytes_sent';
# The scheme the client used (IR-662). This server listens on plain 8080 and TLS
# ends in Caddy in front of it (IR-847), so $scheme alone would always say http.
# Django trusts this header, so only "https" passes through, and this port must
# be reachable only from Caddy: anyone reaching it directly could claim https.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

# Who may reach /django-admin/ (IR-668). Written at container start by
# docker-entrypoint.d/40-iris-django-admin.sh: $django_admin_allowed is 1 only
# for a client in DJANGO_ADMIN_ALLOWED_NETWORKS, so no allowlist allows nobody.
include /tmp/iris-django-admin.conf;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log iris_safe;

    # nginx error messages can embed a raw request URI. The legacy
    # `/activate/<uid>/<token>` paths carry secrets, so suppress their error logs
    # until they are retired (IR-928). The API location below also matches the
    # new body endpoint, POST /api/v1/auth/activate/, which carries none: its
    # errors are silenced and its log line redacted too, which is harmless.
    location ^~ /activate/ {
        error_log /dev/null;
        include /etc/nginx/iris/security-headers.conf;
        try_files /index.html =404;
    }
    location ^~ /api/v1/auth/activate/ {
        error_log /dev/null;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Request bodies up to Django's PDF limit (IR-628).
    #
    # nginx's default is 1m, so without this every ordinary thesis upload got a
    # 413 here and never reached Django. The PDF limit itself lives in
    # backend/apps/documents/validators.py (MAX_PDF_SIZE_BYTES, 50 MiB) and Django
    # stays its authority, with the precise message. This bound only adds room for
    # multipart framing and the form's other fields, and stops bodies that could
    # never pass. Server level, so the manuscript, supplementary, document-request
    # and admin paths all share it. test_upload_size_limit.py pins the two together.
    client_max_body_size 55m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache hashed assets (Vite adds content hash to filenames)
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/iris/security-headers.conf;
    }

    # The pdf.js worker is a hashed .mjs file. This nginx's mime.types maps only
    # .js, so it went out as application/octet-stream, which a browser refuses
    # to run as a module worker -- with or without nosniff (IR-663). An empty
    # `types` makes default_type the type for this location alone.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/iris/security-headers.conf;
    }

    # SPA fallback -- send all unmatched routes to index.html
    # Locations nginx answers itself include the security headers (IR-663);
    # see security-headers.conf for why not at server level.
    location / {
        include /etc/nginx/iris/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # The runtime edge: grant check, service secret, gateway. One file, shared
    # with the dev edge (nginx.dev.conf), so dev and prod route Ask IRIS alike.
    include /etc/nginx/iris/runtime-edge.conf;

    # Proxy API calls to the backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Django's admin, for allowlisted networks only (IR-668). IRIS has no MFA, so
    # the network is the compensating control. ^~ keeps the asset regexes out.
    # This is Django's only page address. /admin/... and /rdco/... are IRIS's
    # own pages and fall through to the SPA, so a refresh loads them (IR-782).
    location ^~ /django-admin/ {
        if ($django_admin_allowed = 0) {
            rewrite ^ /django-admin-refused last;
        }
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Apart from the proxied location above: Django sends its own headers there,
    # and this answer needs nginx's.
    location = /django-admin-refused {
        internal;
        include /etc/nginx/iris/security-headers.conf;
        return 403;
    }

    # Proxy Django static files (admin static, etc. served by WhiteNoise).
    # ^~ keeps the asset regexes out: without it /static/admin/css/base.css
    # matched the .css rule, was looked for in the SPA build and 404ed (IR-782).
    location ^~ /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # No /media/ location block, deliberately (IR-152 / S-01).
    #
    # Serving the media volume here bypassed every permission check in
    # documents/views.py. RecordUpload.file uses upload_to="documents/", so names
    # derive from the uploaded filename -- every thesis was readable at
    # /media/documents/<filename> by anyone who could guess a title.
    #
    # Uploads are served only by RecordUploadDownloadView and
    # RecordFileDownloadView, which check record ownership and write an audit
    # event. If download throughput ever becomes a problem, the answer is
    # X-Accel-Redirect (nginx serves the bytes, Django still authorises) -- not
    # a public alias.
}
