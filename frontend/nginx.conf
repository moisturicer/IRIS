server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache hashed assets (Vite adds content hash to filenames)
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback -- send all unmatched routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Django admin panel calls
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Django static files (admin static, etc. served by WhiteNoise)
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No /media/ location block, deliberately (IR-152 / S-01).
    #
    # Serving the media volume here bypassed every permission check in
    # documents/views.py. RecordUpload.file uses upload_to="documents/", so names
    # derive from the uploaded filename -- every thesis was readable at
    # /media/documents/<filename> by anyone who could guess a title.
    #
    # Uploads are served only by RecordUploadDownloadView and
    # RecordFileDownloadView, which check record ownership and write an audit
    # event. If download throughput ever becomes a problem, the answer is
    # X-Accel-Redirect (nginx serves the bytes, Django still authorises) -- not
    # a public alias.
}
