<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Folio Ribbon (IR-744): SVG for modern browsers, .ico as the fallback. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#6B0F12" />
    <!-- interactive-widget: a phone's software keyboard shrinks the page rather
         than covering it, so a composer pinned to the bottom stays above it
         (IR-570). Chromium honours it; Safari ignores it and pans instead. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"

    />
    <title>IRIS</title>

      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
