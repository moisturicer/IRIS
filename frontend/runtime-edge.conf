# Included inside a server block by nginx.conf (production) and nginx.dev.conf (dev).
# Needs $forwarded_proto and the docker-entrypoint.d/41 script's /tmp file.
# Authenticated, small reader projections go directly to the private runtime.
# Override client grant/protocol/credential headers; Django supplies identity only.
location = /_iris_runtime_reader_auth {
    internal;
    proxy_pass http://backend:8000/api/v1/ai/runtime/edge-grant/;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-IRIS-Record $http_x_iris_record;
}
location ~ "^/api/v1/ai/runtime/(runs(?:/[0-9a-fA-F-]{36}(?:/(?:cancel|retry))?)?|conversations(?:/[0-9a-fA-F-]{36}(?:/compact)?)?)$" {
    include /etc/nginx/iris/security-headers.conf;
    auth_request /_iris_runtime_reader_auth;
    auth_request_set $reader_grant $upstream_http_x_iris_reader_grant;
    include /tmp/iris-runtime-reader.conf;
    proxy_set_header X-IRIS-Reader-Grant $reader_grant;
    proxy_set_header X-IRIS-Protocol runs-reader-1;
    proxy_set_header Authorization "";
    proxy_hide_header X-IRIS-Service-Secret;
    proxy_hide_header X-IRIS-Reader-Grant;
    add_header Cache-Control "no-store" always;
    client_max_body_size 16k;
    # Resolved per request through Docker's DNS, not when nginx loads (IR-892):
    # a literal upstream host stops nginx from starting at all whenever
    # ai-gateway isn't running, as in the Core journeys stack. Without it this
    # route answers 502 and everything else is served. `set` comes before the
    # `rewrite ... break`, which ends this location's rewrite directives.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $iris_ai_gateway ai-gateway:8001;
    rewrite ^/api/v1/ai/runtime/(.*)$ /api/v1/ai/$1 break;
    proxy_pass http://$iris_ai_gateway;
}
