version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      # Sourced from the repo-root .env (see .env.example). ":?" makes an
      # unset value stop `docker compose up` with a named error instead of
      # provisioning Postgres with a credential committed to the repository.
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in the repo-root .env}
      POSTGRES_USER: ${DB_USER:?set DB_USER in the repo-root .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the repo-root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENT_FILE: production.txt
    restart: unless-stopped
    # ASGI, per ADR-017 (IR-156). This `command:` overrides the image's
    # CMD, so changing the Dockerfile alone left production on sync WSGI
    # workers -- where one call to the AI gateway blocks one of only four
    # workers for a whole model round trip.
    command: gunicorn config.asgi:application --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 4 --timeout 120
    volumes:
      - media_files:/app/media
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_HOST=db
      - DB_NAME=${DB_NAME:?set DB_NAME in the repo-root .env}
      - DB_USER=${DB_USER:?set DB_USER in the repo-root .env}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in the repo-root .env}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DOCLING_API_URL=http://docling:5001
      - AI_GATEWAY_URL=http://ai-gateway:8001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  docling:
    image: quay.io/docling-project/docling-serve:latest
    restart: unless-stopped
    environment:
      - DOCLING_SERVE_ENABLE_UI=0
      - DOCLING_SERVE_CONCURRENCY=4
      - DOCLING_SERVE_MAX_NUM_PAGES=200
      - DOCLING_SERVE_MAX_FILE_SIZE=52428800 # 50MB
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:5001/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4g

  ai-gateway:
    build:
      context: ./ai
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./ai/.env
    environment:
      # Same repo-root .env as every other service, so the credential is
      # configured in exactly one place. Note ADR-014 precondition 4 says
      # the gateway gets no direct DB access at all -- that this DSN
      # exists is a contradiction recorded on IR-154, to be resolved by
      # IR-58, not silently here.
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:?set DB_USER in the repo-root .env}:${DB_PASSWORD:?set DB_PASSWORD in the repo-root .env}@db:5432/${DB_NAME:?set DB_NAME in the repo-root .env}
      - UVICORN_WORKERS=4
      - MAX_CONCURRENT_LLM=80
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  celery-default:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENT_FILE: production.txt
    restart: unless-stopped
    command: celery -A config worker -l info -Q default -n default@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d default@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - media_files:/app/media
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_HOST=db
      - DB_NAME=${DB_NAME:?set DB_NAME in the repo-root .env}
      - DB_USER=${DB_USER:?set DB_USER in the repo-root .env}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in the repo-root .env}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-extraction:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENT_FILE: production.txt
    restart: unless-stopped
    command: celery -A config worker -l info -Q extraction -n extraction@%h --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d extraction@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - media_files:/app/media
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_HOST=db
      - DB_NAME=${DB_NAME:?set DB_NAME in the repo-root .env}
      - DB_USER=${DB_USER:?set DB_USER in the repo-root .env}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in the repo-root .env}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DOCLING_API_URL=http://docling:5001
      # Read by config.settings.base.DOCLING_TIMEOUT_SECONDS. Replaces
      # EXTRACTION_TIMEOUT, which was declared here and read by nothing.
      - DOCLING_TIMEOUT_SECONDS=900
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      docling:
        condition: service_healthy

  celery-embedding:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENT_FILE: production.txt
    restart: unless-stopped
    command: celery -A config worker -l info -Q embedding -n embedding@%h --concurrency=4
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d embedding@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - media_files:/app/media
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_HOST=db
      - DB_NAME=${DB_NAME:?set DB_NAME in the repo-root .env}
      - DB_USER=${DB_USER:?set DB_USER in the repo-root .env}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in the repo-root .env}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - AI_GATEWAY_URL=http://ai-gateway:8001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENT_FILE: production.txt
    restart: unless-stopped
    command: celery -A config beat -l info --schedule=/tmp/celerybeat-schedule
    volumes:
      - media_files:/app/media
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DB_HOST=db
      - DB_NAME=${DB_NAME:?set DB_NAME in the repo-root .env}
      - DB_USER=${DB_USER:?set DB_USER in the repo-root .env}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in the repo-root .env}
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # 8080, not 80: the runtime image is nginx-unprivileged, which
      # listens on 8080 because it does not run as root. Mapping 80:80
      # made the frontend unreachable even when it started (IR-156).
      - "80:8080"
    # media_files is deliberately NOT mounted here (IR-152 / S-01). nginx no
    # longer serves /media/, so the web container has no reason to be able to
    # read uploaded documents at all.
    depends_on:
      - backend
      - ai-gateway
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_data:
  media_files:
