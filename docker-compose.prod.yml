version: "3.9"

services:
  db:
    networks:
      - private
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      # Sourced from the repo-root .env (see .env.example). ":?" makes an
      # unset value stop `docker compose up` with a named error instead of
      # provisioning Postgres with a credential committed to the repository.
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in the repo-root .env}
      POSTGRES_USER: ${DB_USER:?set DB_USER in the repo-root .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the repo-root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    networks:
      - private
    image: redis:7-alpine
    restart: unless-stopped
    # A password in both stacks (IR-669). redis-server stays the command so the
    # image's entrypoint still drops root.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run python scripts/setup_env.py to set REDIS_PASSWORD in the repo-root .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?run python scripts/setup_env.py to set REDIS_PASSWORD in the repo-root .env}
    healthcheck:
      # redis-cli exits 0 on a refused command, so read the answer.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    networks:
      - private
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENT_FILE: production.txt
    restart: "no"
    command: python manage.py migrate --noinput
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_HOST=db
      - DB_NAME=${DB_NAME:?set DB_NAME in the repo-root .env}
      - DB_USER=${DB_USER:?set DB_USER in the repo-root .env}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in the repo-root .env}
    depends_on:
      db:
        condition: service_healthy

  backend:
    networks:
      - private
      - egress
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENT_FILE: production.txt
    restart: unless-stopped
    # ASGI, per ADR-017 (IR-156). This `command:` overrides the image's
    # CMD, so changing the Dockerfile alone left production on sync WSGI
    # workers -- where one call to the AI gateway blocks one of only four
    # workers for a whole model round trip.
    command: gunicorn config.asgi:application --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 4 --timeout 120
    volumes:
      - media_files:/app/media
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_HOST=db
      - DB_NAME=${DB_NAME:?set DB_NAME in the repo-root .env}
      - DB_USER=${DB_USER:?set DB_USER in the repo-root .env}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in the repo-root .env}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?run python scripts/setup_env.py to set REDIS_PASSWORD in the repo-root .env}@redis:6379/0
      # Django's cache (IR-132). Database 1, so flushing the Celery
      # broker on 0 cannot take the query-embedding cache with it.
      - REDIS_CACHE_URL=redis://:${REDIS_PASSWORD:?run python scripts/setup_env.py to set REDIS_PASSWORD in the repo-root .env}@redis:6379/1
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?run python scripts/setup_env.py to set REDIS_PASSWORD in the repo-root .env}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?run python scripts/setup_env.py to set REDIS_PASSWORD in the repo-root .env}@redis:6379/0
      - AI_GATEWAY_URL=http://ai-gateway:8001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  ai-gateway:
    networks:
      - private
      - egress
    build:
      context: ./ai
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./ai/.env
    environment:
      # No DATABASE_URL (IR-826, ADR-014 precondition 4): nothing here read
      # it, and it handed Django's login to a service with egress. AI-owned
      # runs still connect as iris_ai_runtime through RUNS_DATABASE_URL in
      # ./ai/.env, hence depends_on db; ADR-014's IR-826 amendment allows
      # that login and no other.
      - UVICORN_WORKERS=4
      - MAX_CONCURRENT_LLM=80
      - RUNS_REDIS_URL=redis://:${REDIS_PASSWORD:?run python scripts/setup_env.py to set REDIS_PASSWORD in the repo-root .env}@redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  # Research workers for AI-owned runs (IR-723). Every Ask IRIS and Paper Chat
  # question is a run since IR-957, so without this nothing is answered.
  ai-runs-worker:
    networks:
      - private
      - egress
    build:
      context: ./ai
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python -m ai.runs.worker
    env_file:
      - ./ai/.env
    environment:
      - RUNS_REDIS_URL=redis://:${REDIS_PASSWORD:?run python scripts/setup_env.py to set REDIS_PASSWORD in the repo-root .env}@redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  celery-default:
    networks:
      - private
      - egress
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENT_FILE: production.txt
    restart: unless-stopped
    command: celery -A config worker -l info -Q default -n default@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d default@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - media_files:/app/media
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_HOST=db
      - DB_NAME=${DB_NAME:?set DB_NAME in the repo-root .env}
      - DB_USER=${DB_USER:?set DB_USER in the repo-root .env}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in the repo-root .env}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?run python scripts/setup_env.py to set REDIS_PASSWORD in the repo-root .env}@redis:6379/0
      # Django's cache (IR-132). Database 1, so flushing the Celery
      # broker on 0 cannot take the query-embedding cache with it.
      - REDIS_CACHE_URL=redis://:${REDIS_PASSWORD:?run python scripts/setup_env.py to set REDIS_PASSWORD in the repo-root .env}@redis:6379/1
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?run python scripts/setup_env.py to set REDIS_PASSWORD in the repo-root .env}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?run python scripts/setup_env.py to set REDIS_PASSWORD in the repo-root .env}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery-extraction:
    # LlamaParse is a cloud service (ADR-056, IR-842), so the worker that sends
    # PDFs to it needs a route out. It also downloads results from presigned
    # storage URLs on another host.
    networks:
      - private
      - egress
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENT_FILE: production.txt
    restart: unless-stopped
    command: celery -A config worker -l info -Q extraction -n extraction@%h --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d extraction@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - media_files:/app/media
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_HOST=db
      - DB_NAME=${DB_NAME:?set DB_NAME in the repo-root .env}
      - DB_USER=${DB_USER:?set DB_USER in the repo-root .env}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in the repo-root .env}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?run python scripts/setup_env.py to set REDIS_PASSWORD in the repo-root .env}@redis:6379/0
      # Django's cache (IR-132). Database 1, so flushing the Celery
      # broker on 0 cannot take the query-embedding cache with it.
      - REDIS_CACHE_URL=redis://:${REDIS_PASSWORD:?run python scripts/setup_env.py to set REDIS_PASSWORD in the repo-root .env}@redis:6379/1
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?run python scripts/setup_env.py to set REDIS_PASSWORD in the repo-root .env}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?run python scripts/setup_env.py to set REDIS_PASSWORD in the repo-root .env}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery-embedding:
    networks:
      - private
      - egress
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENT_FILE: production.txt
    restart: unless-stopped
    command: celery -A config worker -l info -Q embedding -n embedding@%h --concurrency=4
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d embedding@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - media_files:/app/media
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_HOST=db
      - DB_NAME=${DB_NAME:?set DB_NAME in the repo-root .env}
      - DB_USER=${DB_USER:?set DB_USER in the repo-root .env}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in the repo-root .env}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?run python scripts/setup_env.py to set REDIS_PASSWORD in the repo-root .env}@redis:6379/0
      # Django's cache (IR-132). Database 1, so flushing the Celery
      # broker on 0 cannot take the query-embedding cache with it.
      - REDIS_CACHE_URL=redis://:${REDIS_PASSWORD:?run python scripts/setup_env.py to set REDIS_PASSWORD in the repo-root .env}@redis:6379/1
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?run python scripts/setup_env.py to set REDIS_PASSWORD in the repo-root .env}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?run python scripts/setup_env.py to set REDIS_PASSWORD in the repo-root .env}@redis:6379/0
      - AI_GATEWAY_URL=http://ai-gateway:8001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery-beat:
    networks:
      - private
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENT_FILE: production.txt
    restart: unless-stopped
    command: celery -A config beat -l info --schedule=/tmp/celerybeat-schedule
    volumes:
      - media_files:/app/media
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?run python scripts/setup_env.py to set REDIS_PASSWORD in the repo-root .env}@redis:6379/0
      - DB_HOST=db
      - DB_NAME=${DB_NAME:?set DB_NAME in the repo-root .env}
      - DB_USER=${DB_USER:?set DB_USER in the repo-root .env}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in the repo-root .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    networks:
      - private
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Not published (IR-847): Caddy is the only way in. nginx listens on 8080
    # because the runtime image is nginx-unprivileged (IR-156).
    # Set in the repo-root .env (IR-668). No allowlist closes /django-admin/ to
    # everyone. The proxy count must match backend/.env's.
    environment:
      - DJANGO_ADMIN_ALLOWED_NETWORKS=${DJANGO_ADMIN_ALLOWED_NETWORKS:-}
      - TRUSTED_PROXY_COUNT=${TRUSTED_PROXY_COUNT:-}
      # Server-only nginx credential. Never use a VITE_ prefix for this secret.
      - AI_GATEWAY_SERVICE_SECRET=${AI_GATEWAY_SERVICE_SECRET:?run python scripts/setup_env.py to set AI_GATEWAY_SERVICE_SECRET in the repo-root .env}
    # media_files is deliberately NOT mounted here (IR-152 / S-01). nginx no
    # longer serves /media/, so the web container has no reason to be able to
    # read uploaded documents at all.
    depends_on:
      - backend
      - ai-gateway
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # TLS (IR-847, ADR-057). Needs a public IRIS_DOMAIN with ports 80 and 443 open,
  # and TRUSTED_PROXY_COUNT=2. Certificates persist in caddy_data, so a restart
  # doesn't request new ones.
  caddy:
    networks:
      - private
      - egress
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - IRIS_DOMAIN=${IRIS_DOMAIN:?set IRIS_DOMAIN in the repo-root .env}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

# IR-825: `private` has no route to the internet, which contains a compromised
# parser, database or cache. Only services that call a vendor, send mail or get
# certificates also join `egress`. docs/security/SECURITY.md §7 lists why each does.
networks:
  private:
    internal: true
  egress:

volumes:
  postgres_data:
  media_files:
  caddy_data:
  caddy_config:
