[pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
testpaths = apps
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers

markers =
    django_required: needs Django settings and the installed backend dependencies
    db_required: needs a live PostgreSQL with the pgvector extension

# The chunking domain is pure: no Django, no database, no network, no clock.
# Its tests run anywhere pytest runs. Tests that need Django or a database
# carry a marker and skip cleanly when the environment cannot support them,
# so a missing database is never reported as a pass.
#
# DJANGO_SETTINGS_MODULE above only takes effect when pytest-django is
# installed (a pure-chunking environment need not have it). Once it is,
# Django boots eagerly at collection time, which needs SECRET_KEY resolvable
# — from backend/.env locally, from the CI job's env vars in CI — same as
# manage.py. That is deliberate, not a gap: it is what makes the import smoke
# test below actually exercise the URLconf on every run, not just when a
# django_required test happens to be selected.
