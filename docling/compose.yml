# The Docling service, in two variants. docker-compose.yml and
# docker-compose.prod.yml pick one with `extends`, using DOCLING_VARIANT from
# the repo-root .env (scripts/setup_env.py writes it after looking for a GPU).
#
# Compose cannot make a GPU reservation conditional: on a host without the
# NVIDIA runtime, any reservation stops the container from being created. So
# the choice is made once, up front, rather than at run time.
#
# Every number here is an environment variable with a default, so a deployment
# retunes it in .env without editing this file. Measurements and the reasoning
# are in docs/engineering/DOCLING_RESOURCES.md.
services:
  docling-cpu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCLING_BASE: quay.io/docling-project/docling-serve-cpu:v1.36.0
    image: iris-docling:cpu
    restart: unless-stopped
    environment:
      # DOCLING_SERVE_CONCURRENCY does not exist in docling-serve 1.36; the
      # worker count is this one. Each worker holds its own copy of every model.
      # Keep it at 1: measured on the GPU, 1 worker did 2.8 papers/min and 2, 3
      # and 4 did 2.3, 2.0 and 1.8 (workers are threads in one process, and the
      # GPU is the bottleneck); at 4 the 8 GB cap started losing formulas.
      - DOCLING_SERVE_ENG_LOC_NUM_WORKERS=${DOCLING_WORKERS:-1}
      - DOCLING_SERVE_OPTIONS_CACHE_SIZE=1
      - DOCLING_SERVE_MAX_NUM_PAGES=200
      - DOCLING_SERVE_MAX_FILE_SIZE=52428800 # 50MB
      # The binding ceiling on a synchronous conversion (IR-249): IRIS waits
      # DOCLING_TIMEOUT_SECONDS on the worker, but the server gives up first at
      # its own default of 120 and returns 504. Keep the two equal.
      - DOCLING_SERVE_MAX_SYNC_WAIT=${DOCLING_MAX_SYNC_WAIT:-900}
      - DOCLING_SERVE_ENABLE_UI=${DOCLING_ENABLE_UI:-0}
      - OMP_NUM_THREADS=${DOCLING_CPU_THREADS:-4}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "${DOCLING_CPUS:-4}"
          memory: ${DOCLING_MEMORY:-6g}

  docling-gpu:
    extends:
      service: docling-cpu
    build:
      args:
        DOCLING_BASE: quay.io/docling-project/docling-serve-cu128:v1.36.0
    image: iris-docling:gpu
    environment:
      - DOCLING_SERVE_ENG_LOC_NUM_WORKERS=${DOCLING_WORKERS:-1}
      # Enforced inside the server process (iris_gpu_cap.py); Docker cannot limit VRAM.
      - DOCLING_GPU_MEMORY_GB=${DOCLING_GPU_MEMORY_GB:-8}
      - OMP_NUM_THREADS=${DOCLING_CPU_THREADS:-2}
    deploy:
      resources:
        limits:
          # Measured at one process: 5.5 GB RAM and 280% CPU peak on 14 papers.
          cpus: "${DOCLING_CPUS:-4}"
          memory: ${DOCLING_MEMORY:-8g}
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
