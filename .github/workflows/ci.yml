name: CI

on:
  push:
    branches: [feat/rag-service, main]
  pull_request:
    branches: [feat/rag-service, main]

# CI is evidence, not decoration.
# It is expected to FAIL until IR-57 (application boot) and IR-58 (Docker stack) land.
# Do not weaken a gate to make it green — fix the defect it is reporting.

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Without this, `conftest.py::_needs_a_real_database` skips every
    # TransactionTestCase subclass -- which APITestCase is -- and the whole
    # authorization suite is collected, skipped, and reported GREEN without
    # running. A gate that cannot fail is not a gate (IR-165).
    # pgvector/pgvector rather than plain postgres: apps/ai migrations create a
    # VectorField and need the extension available.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: iris
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Static check for undefined names
        # Catches the class of defect that currently stops the app importing.
        # flake8 (in requirements/development.txt), not bare pyflakes, so the
        # codebase's existing `# noqa` markers (deliberate side-effect imports)
        # are honored; backend/.flake8 selects only the F-codes (pyflakes' own
        # checks) and excludes migrations, where apps.get_model() locals read
        # as undefined names to static analysis.
        run: flake8 apps/ config/ core/

      - name: Django configuration check
        # Fails while the URLconf cannot import — this is the point.
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: ci-only-not-a-real-secret
          DEBUG: 'False'
        run: python manage.py check

      - name: Migration consistency
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: ci-only-not-a-real-secret
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: ci-only-not-a-real-secret
          DB_NAME: iris
          DB_USER: iris
          DB_PASSWORD: iris
          DB_HOST: localhost
          DB_PORT: '5432'
        # pytest and pytest-django are pinned in requirements/development.txt
        # (IR-82), already installed above. The import smoke test in
        # apps/tests/test_boot.py is what actually fails when the URLconf
        # cannot import — this step just has to run it.
        #
        # `-p no:randomly --strict-markers` is inherited from pytest.ini.
        # `-ra` surfaces the skip reasons, which is how you notice the database
        # went away again: a skipped authorization suite must be visible in the
        # log, not silently green.
        run: pytest -ra

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # Runs `tsc && vite build`, so a type error fails the build. Intended.
        run: npm run build

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    # Verified 2026-09-02: this job FAILS on the current baseline with
    #   "env file .../ai/.env not found"
    # because both Compose files declare an `ai-gateway` service whose env file
    # ai/.env is gitignored and absent in CI. The ./ai build context now exists;
    # the missing env file is what breaks it. ADR-014 adopts the gateway as a
    # sixth service under five preconditions, one of which is that it boots.
    # IR-58 removes the service; this job goes green then. Do not silence it.
    steps:
      - uses: actions/checkout@v4

      - name: Provide env file
        # backend/.env is gitignored. Compose interpolation needs it to exist,
        # so seed it from the committed example. Values are placeholders.
        run: cp backend/.env.example backend/.env

      - name: Validate development stack
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production stack
        run: docker compose -f docker-compose.prod.yml config --quiet

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependency audit (Python)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements/base.txt --desc || true

      - name: Dependency audit (Node)
        working-directory: frontend
        run: npm audit --audit-level=high || true
