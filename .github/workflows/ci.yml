name: CI

on:
  push:
    branches: [feat/rag-service, main]
  pull_request:
    branches: [feat/rag-service, main]

# CI is evidence, not decoration.
# Application boot was restored by IR-155 (not IR-57, which no longer
# exists) and the Docker stack by IR-156 (not IR-58). Both original keys
# were superseded during the 2026-09-05 renumbering; this line named them
# for two days after they stopped resolving.
# Do not weaken a gate to make it green — fix the defect it is reporting.

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Without this, `conftest.py::_needs_a_real_database` skips every
    # TransactionTestCase subclass -- which APITestCase is -- and the whole
    # authorization suite is collected, skipped, and reported GREEN without
    # running. A gate that cannot fail is not a gate (IR-165).
    # pgvector/pgvector rather than plain postgres: apps/ai migrations create a
    # VectorField and need the extension available.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: iris
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Static check for undefined names
        # Catches the class of defect that currently stops the app importing.
        # flake8 (in requirements/development.txt), not bare pyflakes, so the
        # codebase's existing `# noqa` markers (deliberate side-effect imports)
        # are honored; backend/.flake8 selects only the F-codes (pyflakes' own
        # checks) and excludes migrations, where apps.get_model() locals read
        # as undefined names to static analysis.
        #
        # This step is what closes the "pyflakes installed" criterion carried
        # open by both IR-155 and IR-163 — flake8>=7.0 bundles pyflakes, and
        # `select = F` runs pyflakes' checks and nothing else. Verified 2026-09-07
        # rather than assumed: clean on apps/records/views.py (the file IR-155
        # named) and on the whole set above, and demonstrated to FAIL — a
        # temporary `return deliberately_undefined_name` produced
        # `F821 undefined name` and exit 1. A check nobody has watched fail is
        # not yet evidence.
        run: flake8 apps/ config/ core/ testing/

      - name: Django configuration check
        # Fails while the URLconf cannot import — this is the point.
        #
        # The DB_* vars are mandatory as of IR-154: base.py reads them through
        # required() and refuses to start when one is missing, so this step
        # must supply them even though it never opens a connection.
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: ci-only-not-a-real-secret
          DEBUG: 'False'
          DB_NAME: iris
          DB_USER: iris
          DB_PASSWORD: iris
          DB_HOST: localhost
          DB_PORT: '5432'
        run: python manage.py check

      - name: Production settings refuse a public-unsafe configuration
        # IR-154's testing requirement, as two runs of the real module rather
        # than an assertion about its source. The first proves a correctly
        # configured production deployment boots; the second proves an empty
        # ALLOWED_HOSTS stops it. `!` inverts the exit code, so this step fails
        # if the bad configuration is ever accepted.
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-only-not-a-real-secret
          DB_NAME: iris
          DB_USER: iris
          DB_PASSWORD: iris
          DB_HOST: localhost
          DB_PORT: '5432'
        run: |
          ALLOWED_HOSTS=iris.example.edu           CORS_ALLOWED_ORIGINS=https://iris.example.edu             python -c "import django; django.setup(); from django.conf import settings; assert settings.DEBUG is False; assert settings.ALLOWED_HOSTS == ['iris.example.edu']; print('production settings boot OK')"
          ! ALLOWED_HOSTS=             CORS_ALLOWED_ORIGINS=https://iris.example.edu             python -c "import django; django.setup()"
          echo "production settings correctly refused an empty ALLOWED_HOSTS"

      - name: Migration consistency
        # The DB_* vars matter: without them this step reached for the settings
        # default (`iris_user`) and logged `password authentication failed`,
        # then passed anyway. `makemigrations --check` degrades to a
        # model-vs-migration diff when it cannot connect, silently skipping the
        # applied-history consistency check it is here to perform.
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: ci-only-not-a-real-secret
          DB_NAME: iris
          DB_USER: iris
          DB_PASSWORD: iris
          DB_HOST: localhost
          DB_PORT: '5432'
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: ci-only-not-a-real-secret
          DB_NAME: iris
          DB_USER: iris
          DB_PASSWORD: iris
          DB_HOST: localhost
          DB_PORT: '5432'
          # The other half of the IR-165 fix. The postgres service above makes
          # the database-backed tests *able* to run; this makes them *have* to.
          # Without it, if the service fails to come up, conftest.py skips every
          # TransactionTestCase and the job passes having verified nothing —
          # which is exactly how the authorization suite shipped green without
          # ever executing. `-ra` below makes a skip visible; this makes it
          # fatal, and visible-but-not-fatal is what let it go unnoticed for a
          # day. See backend/testing/harness.py (IR-163).
          IRIS_REQUIRE_DB: '1'
        # pytest and pytest-django are pinned in requirements/development.txt
        # (IR-82), already installed above. The import smoke test in
        # apps/tests/test_boot.py is what actually fails when the URLconf
        # cannot import — this step just has to run it.
        #
        # `-p no:randomly --strict-markers` is inherited from pytest.ini.
        # `-ra` surfaces the skip reasons for the skips that remain legitimate
        # (an individual test opting out), not for a wholesale environment
        # failure — IRIS_REQUIRE_DB above stops the run outright for that.
        run: pytest -ra

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # Runs `tsc && vite build`, so a type error fails the build. Intended.
        run: npm run build

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    # Was red from 2026-09-02 until IR-156: both Compose files declare an
    # `ai-gateway` whose env file ai/.env is gitignored and absent in CI, so
    # `docker compose config` failed before validating anything.
    #
    # The previous note here said "IR-58 removes the service; this job goes
    # green then." Both halves were wrong. IR-58 does not exist -- it was
    # superseded by IR-156 -- and the decision went the other way: ADR-014
    # ADOPTS the gateway as a sixth service under five preconditions, and
    # ADR-018-era work fixes it rather than deleting it. A reader following
    # that comment would have removed a service the team decided to keep.
    steps:
      - uses: actions/checkout@v4

      - name: Provide env files
        # backend/.env and ai/.env are both gitignored. Compose interpolation
        # and the ai-gateway `env_file:` need them to exist, so seed both from
        # their committed examples. Values are placeholders; ai/.env.example
        # was added by IR-156 and is what unblocks this job.
        run: |
          cp backend/.env.example backend/.env
          cp ai/.env.example ai/.env
          # The repo-root .env is what Compose interpolates ${DB_*} from
          # (IR-154). Copying .env.example is not enough: its values are blank
          # by design and `${VAR:?}` rejects blank exactly as it rejects unset,
          # which is the behaviour the dev stack wants and this job must
          # satisfy with throwaway values.
          {
            echo "DB_NAME=iris"
            echo "DB_USER=iris"
            echo "DB_PASSWORD=ci-only-not-a-real-secret"
          } > .env

      - name: Validate development stack
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production stack
        run: docker compose -f docker-compose.prod.yml config --quiet

      # `config --quiet` resolves and validates the compose files; it does not
      # run a build. That gap let main reach a state where the backend image
      # could not be built at all while all four jobs reported green (IR-198) --
      # the same shape of hole as IR-163's skipped suite and IR-165's
      # everything-skips-without-a-database. Building the image is the only
      # thing that actually proves it builds.
      #
      # Backend only, deliberately: it is the image with a Django build step to
      # break. The frontend job already runs a real `npm run build`.
      - name: Build the backend image
        run: docker compose -f docker-compose.yml build backend

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependency audit (Python)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements/base.txt --desc || true

      - name: Dependency audit (Node)
        working-directory: frontend
        run: npm audit --audit-level=high || true
