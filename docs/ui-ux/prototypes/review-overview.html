:root {
  --maroon:#6B0F12; --maroon-hi:#8B1316; --maroon-dk:#4A0A0C; --wash:rgb(107 15 18 / .07);
  --s50:#fafaf9; --s100:#f5f5f4; --s200:#e7e5e4; --s300:#d6d3d1; --field:#8f8884;
  --s500:#78716c; --s600:#57534e; --s700:#44403c; --ink:#1c1917;
  --green:#1E6B3F; --green-line:#3F8A5A; --green-wash:#EAF3EC; --amber:#8a4b08; --amber-line:#b7791f;
  --serif:"EB Garamond",Georgia,serif; --sans:"Inter",system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box} html,body{margin:0}
body{font:15px/24px var(--sans);color:var(--s700);background:#fff;-webkit-font-smoothing:antialiased}
::selection{background:#f5d5d6;color:var(--ink)}
h1,h2,h3,p,ul,ol,dl,dd,blockquote{margin:0;padding:0} ul,ol{list-style:none}
h1,h2{font-family:var(--serif);font-weight:600;color:var(--ink);letter-spacing:-.015em;text-wrap:balance}
button,input{font:inherit;color:inherit} button{cursor:pointer}
svg{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.small{font-size:13px;line-height:20px}

/* App frame, for context only */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--s50);border-right:1px solid var(--s200);padding:18px 12px;position:sticky;top:0;height:100vh}
.side b{font:600 22px/28px var(--serif);color:var(--maroon);letter-spacing:.08em;padding:0 12px;display:block;margin-bottom:18px}
.side span{display:flex;align-items:center;min-height:40px;padding:0 12px;border-radius:12px;font-weight:500}
.side span.on{background:var(--s200);color:var(--ink);font-weight:600}
.bar{height:56px;border-bottom:1px solid var(--s200);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;background:#fff;z-index:5}
.seg{display:flex;background:var(--s200);border-radius:99px;padding:3px}
.seg>span{padding:5px 16px;border-radius:99px;font-weight:600;font-size:13px;line-height:20px}
.seg .on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.1)}
.back{font-size:14px;color:var(--s600)}
main{padding:36px 24px 150px}

/* Shared parts */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border-radius:99px;border:1px solid var(--s300);background:#fff;font-size:14px;font-weight:500;color:var(--s700);transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--wash);color:var(--maroon-dk);border-color:rgb(107 15 18/.25)}
.btn.primary{background:var(--maroon);border-color:var(--maroon);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--maroon-hi)}
.btn[aria-disabled=true]{background:var(--s100);border-color:var(--s200);color:var(--s600);cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--maroon);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.title{font-size:clamp(26px,3.2vw,34px);line-height:1.15}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:10px;font-size:14px;color:var(--s600)}
.meta .who{display:inline-flex;align-items:center;gap:7px;background:var(--s100);border-radius:99px;padding:2px 12px 2px 8px;color:var(--s700);font-weight:500}
.ok{color:var(--green)} .att{color:var(--maroon)} .rev{color:var(--amber)} .idle{color:var(--s500)}
.abs h2,.sec{font-size:22px;line-height:28px;margin-bottom:8px}
.abs p{font-size:17px;line-height:28px;max-width:68ch}
blockquote{font-size:18px;line-height:28px;color:var(--ink);text-wrap:pretty}

/* The drop field */
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;min-height:176px;padding:24px;border:1.5px dashed var(--field);border-radius:16px;background:var(--s50);cursor:pointer;transition:background .2s var(--ease),border-color .2s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease)}
.drop:hover,.drop:focus-within{background:var(--wash);border-color:var(--maroon)}
.drop.over{background:#fff;border-color:var(--maroon);border-style:solid;transform:translateY(-2px);box-shadow:0 14px 34px -14px rgb(107 15 18/.35)}
.drop .ico{font-size:30px;color:var(--maroon);margin-bottom:6px;transition:transform .3s var(--ease)}
.drop.over .ico{transform:translateY(4px)}
.drop strong{color:var(--ink);font-weight:600;font-size:16px}

const zone = t => t.closest?.('[data-drop],[data-desk],[data-row]');

document.addEventListener('dragover', e => { e.preventDefault(); const z=zone(e.target); if (z!==lit){ lit?.classList.remove('over'); lit = z && !(z.matches('[data-desk]') && (!model().drop || S.up)) ? z : null; lit?.classList.add('over'); } });
document.addEventListener('dragleave', e => { if (!e.relatedTarget){ lit?.classList.remove('over'); lit=null; } });
document.addEventListener('drop', e => { e.preventDefault(); const z=zone(e.target); lit?.classList.remove('over'); lit=null; if (z && e.dataTransfer.files[0]) model().many ? takeMany(e.dataTransfer.files, z.dataset.row) : take(e.dataTransfer.files[0]); });
render();
</script>
</body>
</html>
