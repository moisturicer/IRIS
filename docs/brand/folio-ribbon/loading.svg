<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Loading"><title>Loading</title><style>
.lf-l,.lf-r{transform-box:fill-box;animation:fold 1.8s cubic-bezier(.16,1,.3,1) infinite}
.lf-l{transform-origin:100% 50%}
.lf-r{transform-origin:0 50%;animation-delay:.18s}
.lf-i{animation:ink 1.8s ease-out infinite}
@keyframes fold{0%{transform:scaleX(.08);opacity:.25}45%,80%{transform:scaleX(1);opacity:1}100%{transform:scaleX(.08);opacity:.25}}
@keyframes ink{0%,20%{opacity:0}45%,85%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><mask id="fo-l" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
  <rect width="120" height="120" fill="#fff"/>
  <path d="M8 73 C25 64 38 69 51 78" fill="none" stroke="#000" stroke-width="3.4"/>
  <path d="M112 47 C95 56 82 51 69 42" fill="none" stroke="#000" stroke-width="3.4"/>
</mask></defs><g mask="url(#fo-l)" fill="#6B0F12">
  <path class="lf-l" d="M10 22 L50 41 L50 80 C37 82 22 89 10 100 Z"/>
  <path class="lf-r" d="M110 98 L70 79 L70 40 C83 38 98 31 110 20 Z"/>
</g>
<path class="lf-i" d="M46 26 H74 V36 Q65 36 65 44 V76 Q65 84 74 84 V94 H46 V84 Q55 84 55 76 V44 Q55 36 46 36 Z" fill="#6B0F12"/></svg>
