<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Loading"><title>Loading</title><style>
.ar-l,.ar-r{animation:close 1.8s cubic-bezier(.16,1,.3,1) infinite}
.ar-l{--x:-14px}.ar-r{--x:14px}
.ar-b{transform-box:fill-box;transform-origin:50% 100%;animation:rise 1.8s cubic-bezier(.16,1,.3,1) infinite}
@keyframes close{0%{transform:translateX(var(--x));opacity:.3}40%,80%{transform:none;opacity:1}100%{transform:translateX(var(--x));opacity:.3}}
@keyframes rise{0%,25%{transform:scaleY(0)}60%,85%{transform:scaleY(1)}100%{transform:scaleY(0)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><mask id="ar-l" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
  <rect width="120" height="120" fill="#fff"/>
  <rect x="29.5" y="36" width="7" height="58" rx="1" fill="#000"/>
  <rect x="83.5" y="36" width="7" height="58" rx="1" fill="#000"/>
</mask></defs><g mask="url(#ar-l)" fill="#6B0F12">
  <path class="ar-l" d="M20 102 V38 Q20 16 42 16 H58 V26.2 A10 10 0 0 0 58 45.8 V49 L54 54 V102 Z"/>
  <path class="ar-r" d="M100 102 V38 Q100 16 78 16 H62 V26.2 A10 10 0 0 1 62 45.8 V49 L66 54 V102 Z"/>
</g>
<g fill="#C9973A" class="ar-b">
  <rect x="31.5" y="38" width="3" height="54" rx="1"/>
